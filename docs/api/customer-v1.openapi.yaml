openapi: 3.1.0
info:
  title: GoldPlatform Customer API
  version: 1.5.0-recovery-cp07
  description: |
    قرارداد افزایشی و Read-only پنل مشتری. مسیرهای Legacy حذف یا تغییر نکرده‌اند.
    Kimia منبع حقیقت Money، Gold، Coin و Currency است و Custody منبع داخلی GoldPlatform باقی می‌ماند.
    هیچ Kimia write، فرمول قیمت یا قانون مالی جدیدی در این قرارداد تعریف نمی‌شود.
servers:
  - url: /api/v1/customer
paths:
  /dashboard:
    get:
      operationId: getCustomerDashboard
      summary: دریافت خلاصه عملیاتی و امن پنل مشتری
      security: [{ sanctum: [] }]
      responses:
        '200':
          description: خلاصه پنل مشتری
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /profile:
    get:
      operationId: getCustomerProfile
      summary: دریافت پروفایل فقط‌خواندنی و امن مشتری
      security: [{ sanctum: [] }]
      responses:
        '200':
          description: پروفایل مشتری احراز هویت‌شده بدون شناسه‌ها و فیلدهای حساس داخلی
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /assets:
    get:
      operationId: getCustomerAssets
      summary: دریافت همه مانده‌های مالی مشتری
      security: [{ sanctum: [] }]
      responses:
        '200':
          description: فهرست Money، Gold، Coin و Currency متعلق به مشتری
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetListResponse' }
  /assets/money:
    get:
      operationId: getCustomerMoneyAssets
      summary: دریافت حساب‌های پولی مشتری
      security: [{ sanctum: [] }]
      responses:
        '200':
          description: حساب‌های Money مشتری
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetListResponse' }
  /assets/gold:
    get:
      operationId: getCustomerGoldAssets
      summary: دریافت حساب‌های طلایی مشتری
      security: [{ sanctum: [] }]
      responses:
        '200':
          description: حساب‌های Gold مشتری
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetListResponse' }
  /assets/coins:
    get:
      operationId: getCustomerCoinAssets
      summary: دریافت سکه‌های پویا متعلق به مشتری
      security: [{ sanctum: [] }]
      responses:
        '200':
          description: فهرست Dynamic Coin بدون شناسه داخلی Kimia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetListResponse' }
  /assets/currencies:
    get:
      operationId: getCustomerCurrencyAssets
      summary: دریافت ارزهای پویا متعلق به مشتری
      security: [{ sanctum: [] }]
      responses:
        '200':
          description: فهرست Dynamic Currency بدون شناسه داخلی Kimia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetListResponse' }
  /order-statuses:
    get:
      operationId: getCustomerOrderStatuses
      summary: دریافت کاتالوگ وضعیت‌های واقعی سفارش
      security: [{ sanctum: [] }]
      responses:
        '200':
          description: کد وضعیت و terminal بودن آن براساس State Machine موجود
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderStatusListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /custodies/{reference}:
    get:
      operationId: getCustomerCustody
      summary: دریافت یک امانت متعلق به مشتری با UUID عمومی
      security: [{ sanctum: [] }]
      parameters:
        - $ref: '#/components/parameters/PublicReference'
      responses:
        '200':
          description: امانت متعلق به مشتری
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustodyResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CustomerNotFound' }
  /custodies/{reference}/delivery-request:
    post:
      operationId: requestCustomerCustodyDelivery
      summary: ثبت درخواست تحویل برای امانت متعلق به مشتری
      security: [{ sanctum: [] }]
      parameters:
        - $ref: '#/components/parameters/PublicReference'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                branch_code: { type: [string, 'null'], maxLength: 80 }
                requested_for: { type: [string, 'null'], format: date-time }
      responses:
        '201':
          description: درخواست تحویل ثبت شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CustomerNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /deliveries/{reference}:
    get:
      operationId: getCustomerDelivery
      summary: دریافت یک درخواست تحویل متعلق به مشتری با UUID عمومی
      security: [{ sanctum: [] }]
      parameters:
        - $ref: '#/components/parameters/PublicReference'
      responses:
        '200':
          description: درخواست تحویل متعلق به مشتری
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CustomerNotFound' }
components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
  parameters:
    PublicReference:
      name: reference
      in: path
      required: true
      description: UUID عمومی پلتفرم؛ شناسه داخلی یا Kimia نیست
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1 }
  responses:
    Unauthenticated:
      description: کاربر احراز هویت نشده است
    Forbidden:
      description: نقش کاربر اجازه دسترسی به پنل مشتری را ندارد
    RateLimited:
      description: تعداد درخواست‌ها بیش از حد مجاز است
    CustomerNotFound:
      description: منبع متعلق به مشتری پیدا نشد یا متعلق به مشتری دیگری است
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: عملیات در وضعیت فعلی مجاز نیست یا کلید Idempotency تعارض دارد
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationFailed:
      description: ورودی یا Idempotency-Key معتبر نیست
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    SuccessEnvelope:
      type: object
      required: [data, meta, message]
      properties:
        data: { type: object }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
        message: { type: [string, 'null'] }
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
        code: { type: [string, 'null'] }
        errors: { type: object }
        request_id: { type: [string, 'null'] }
    ProfileResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [profile]
              properties:
                profile:
                  $ref: '#/components/schemas/CustomerProfile'
    CustomerProfile:
      type: object
      additionalProperties: false
      required: [first_name, last_name, display_name, mobile, mobile_verified, is_active, roles, last_login_at]
      properties:
        first_name: { type: [string, 'null'] }
        last_name: { type: [string, 'null'] }
        display_name: { type: [string, 'null'] }
        mobile: { type: [string, 'null'] }
        mobile_verified: { type: boolean }
        is_active: { type: boolean }
        roles:
          type: array
          items: { type: string }
        last_login_at: { type: [string, 'null'], format: date-time }
    CustodyResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [custody]
              properties:
                custody: { type: object, additionalProperties: true }
    DeliveryResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [delivery]
              properties:
                delivery: { type: object, additionalProperties: true }
    DashboardResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
    AssetListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
    OrderStatusListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
    ResponseMeta:
      type: object
      required: [request_id, generated_at, api_version]
      properties:
        request_id: { type: [string, 'null'] }
        generated_at: { type: string, format: date-time }
        api_version: { type: string, const: v1 }
