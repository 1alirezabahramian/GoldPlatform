openapi: 3.1.0
info:
  title: GoldPlatform Customer API
  version: 1.3.0-order-status
  description: |
    قرارداد افزایشی و Read-only پنل مشتری. مسیرهای Legacy حذف یا تغییر نکرده‌اند.
    هیچ Kimia write، فرمول قیمت یا قانون مالی جدیدی در این قرارداد تعریف نمی‌شود.
servers:
  - url: /api/v1/customer
paths:
  /dashboard:
    get:
      operationId: getCustomerDashboard
      summary: دریافت خلاصه عملیاتی و امن پنل مشتری
      security:
        - sanctum: []
      responses:
        '200':
          description: دارایی‌ها، شمارنده‌ها، موارد مهم و آخرین فعالیت‌های مشتری احراز هویت‌شده
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /assets:
    get:
      operationId: getCustomerAssets
      summary: دریافت همه مانده‌های مالی مشتری
      security:
        - sanctum: []
      responses:
        '200':
          description: فهرست Money، Gold، Coin و Currency متعلق به مشتری
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetListResponse'
  /assets/money:
    get:
      operationId: getCustomerMoneyAssets
      summary: دریافت حساب‌های پولی مشتری
      security:
        - sanctum: []
      responses:
        '200':
          description: حساب‌های Money مشتری
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetListResponse'
  /assets/gold:
    get:
      operationId: getCustomerGoldAssets
      summary: دریافت حساب‌های طلایی مشتری
      security:
        - sanctum: []
      responses:
        '200':
          description: حساب‌های Gold مشتری
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetListResponse'
  /assets/coins:
    get:
      operationId: getCustomerCoinAssets
      summary: دریافت سکه‌های پویا متعلق به مشتری
      security:
        - sanctum: []
      responses:
        '200':
          description: فهرست Dynamic Coin بدون شناسه داخلی Kimia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetListResponse'
  /assets/currencies:
    get:
      operationId: getCustomerCurrencyAssets
      summary: دریافت ارزهای پویا متعلق به مشتری
      security:
        - sanctum: []
      responses:
        '200':
          description: فهرست Dynamic Currency بدون شناسه داخلی Kimia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetListResponse'
  /order-statuses:
    get:
      operationId: getCustomerOrderStatuses
      summary: دریافت کاتالوگ وضعیت‌های واقعی سفارش
      description: |
        این پاسخ مستقیماً از OrderStatus فعلی Backend تولید می‌شود و وضعیت جدیدی ایجاد نمی‌کند.
        متن‌های فارسی نمایشی و عملیات مجاز در Stageهای بعد فقط با قرارداد تأییدشده افزوده می‌شوند.
      security:
        - sanctum: []
      responses:
        '200':
          description: کد وضعیت و terminal بودن آن براساس State Machine موجود
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatusListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
  responses:
    Unauthenticated:
      description: کاربر احراز هویت نشده است
    Forbidden:
      description: نقش کاربر اجازه دسترسی به پنل مشتری را ندارد
    RateLimited:
      description: تعداد درخواست‌ها بیش از حد مجاز است
  schemas:
    DashboardResponse:
      type: object
      required: [data, meta, message]
      properties:
        data:
          $ref: '#/components/schemas/DashboardData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        message:
          type: [string, 'null']
    DashboardData:
      type: object
      required: [assets, summary, highlights, recent_activity]
      properties:
        assets:
          type: array
          items:
            $ref: '#/components/schemas/AssetBalance'
        summary:
          $ref: '#/components/schemas/DashboardSummary'
        highlights:
          $ref: '#/components/schemas/DashboardHighlights'
        recent_activity:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/CustomerActivity'
    AssetListResponse:
      type: object
      required: [data, meta, message]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AssetBalance'
        meta:
          allOf:
            - $ref: '#/components/schemas/ResponseMeta'
            - type: object
              required: [asset_type, count]
              properties:
                asset_type:
                  type: [string, 'null']
                  enum: [money, gold, coin, currency, null]
                count:
                  type: integer
                  minimum: 0
        message:
          type: [string, 'null']
    OrderStatusListResponse:
      type: object
      required: [data, meta, message]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              minItems: 9
              maxItems: 9
              items:
                $ref: '#/components/schemas/OrderStatusItem'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        message:
          type: [string, 'null']
    OrderStatusItem:
      type: object
      required: [code, is_terminal]
      properties:
        code:
          type: string
          enum: [pending, approved, executing, settling, completed, rejected, expired, cancelled, failed]
        is_terminal:
          type: boolean
    AssetBalance:
      type: object
      required: [reference, type, title, unit, balance]
      properties:
        reference:
          type: string
          description: شناسه پلتفرمی حساب دارایی؛ شناسه Kimia نیست
        type:
          type: string
          enum: [money, gold, coin, currency]
        title:
          type: string
        unit:
          type: string
          description: واحد ذخیره‌شده فعلی Backend؛ IRR/IRT در این Stage تبدیل نمی‌شود
        balance:
          type: object
          required: [total, blocked, available]
          properties:
            total:
              type: string
              pattern: '^-?[0-9]+(?:\.[0-9]+)?$'
            blocked:
              type: string
              pattern: '^-?[0-9]+(?:\.[0-9]+)?$'
            available:
              type: string
              pattern: '^-?[0-9]+(?:\.[0-9]+)?$'
    DashboardSummary:
      type: object
      required: [active_orders, custodies, delivery_requests, ready_deliveries]
      properties:
        active_orders:
          type: integer
          minimum: 0
        custodies:
          type: integer
          minimum: 0
        delivery_requests:
          type: integer
          minimum: 0
        ready_deliveries:
          type: integer
          minimum: 0
    DashboardHighlights:
      type: object
      required: [active_orders, ready_deliveries]
      properties:
        active_orders:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: true
        ready_deliveries:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: true
    CustomerActivity:
      type: object
      required: [event_type, status, occurred_at, resource]
      properties:
        event_type:
          type: string
          enum: [order_status, custody_status, delivery_status]
        status:
          type: [string, 'null']
        occurred_at:
          type: [string, 'null']
          format: date-time
        resource:
          type: object
          additionalProperties: true
          description: فقط فیلدهای امن CustomerReadPresenter؛ بدون شناسه داخلی یا metadata
    ResponseMeta:
      type: object
      required: [request_id, generated_at, api_version]
      properties:
        request_id:
          type: string
          format: uuid
        generated_at:
          type: string
          format: date-time
        api_version:
          type: string
          const: v1
