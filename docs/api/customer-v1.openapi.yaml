openapi: 3.1.0
info:
  title: GoldPlatform Customer API
  version: 1.4.0-customer-contract
  description: |
    قرارداد نسخه‌دار پنل مشتری. پیچیدگی مالی، Ledger و Kimia در Backend باقی می‌ماند.
    این سند هیچ قانون مالی، فرمول قیمت، کارمزد یا عملیات Kimia جدیدی تعریف نمی‌کند.
servers:
  - url: /api/v1/customer
security:
  - sanctum: []
paths:
  /bootstrap:
    get:
      operationId: getCustomerBootstrap
      summary: دریافت قراردادهای پایه Frontend
      responses:
        '200': { $ref: '#/components/responses/BootstrapSuccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /dashboard:
    get:
      operationId: getCustomerDashboard
      summary: دریافت خلاصه امن پنل مشتری
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /profile:
    get:
      operationId: getCustomerProfile
      summary: دریافت پروفایل فقط‌خواندنی مشتری
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /activities:
    get:
      operationId: getCustomerActivities
      summary: دریافت Timeline فعالیت‌های مشتری
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: event_type
          in: query
          required: false
          schema:
            type: string
            enum: [order_status, custody_status, delivery_status]
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /assets:
    get:
      operationId: getCustomerAssets
      summary: دریافت همه مانده‌های مالی مشتری
      responses:
        '200': { $ref: '#/components/responses/AssetListSuccess' }
  /assets/money:
    get:
      operationId: getCustomerMoneyAssets
      summary: دریافت مانده‌های Money
      responses:
        '200': { $ref: '#/components/responses/AssetListSuccess' }
  /assets/gold:
    get:
      operationId: getCustomerGoldAssets
      summary: دریافت مانده‌های Gold
      responses:
        '200': { $ref: '#/components/responses/AssetListSuccess' }
  /assets/coins:
    get:
      operationId: getCustomerCoinAssets
      summary: دریافت سکه‌های Dynamic مشتری
      responses:
        '200': { $ref: '#/components/responses/AssetListSuccess' }
  /assets/currencies:
    get:
      operationId: getCustomerCurrencyAssets
      summary: دریافت ارزهای Dynamic مشتری
      responses:
        '200': { $ref: '#/components/responses/AssetListSuccess' }
  /orders:
    get:
      operationId: getCustomerOrders
      summary: دریافت سفارش‌های مشتری
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
  /order-statuses:
    get:
      operationId: getCustomerOrderStatuses
      summary: دریافت وضعیت‌های واقعی سفارش
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
  /custodies:
    get:
      operationId: getCustomerCustodies
      summary: دریافت امانات فیزیکی مشتری
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
  /custodies/{reference}:
    get:
      operationId: getCustomerCustody
      summary: دریافت جزئیات امانت با شناسه عمومی
      parameters:
        - $ref: '#/components/parameters/PublicReference'
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
  /custodies/{reference}/delivery-request:
    post:
      operationId: requestCustomerCustodyDelivery
      summary: ثبت درخواست تحویل برای امانت متعلق به مشتری
      parameters:
        - $ref: '#/components/parameters/PublicReference'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /deliveries:
    get:
      operationId: getCustomerDeliveries
      summary: دریافت درخواست‌های تحویل مشتری
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
  /deliveries/{reference}:
    get:
      operationId: getCustomerDelivery
      summary: دریافت جزئیات تحویل با شناسه عمومی
      parameters:
        - $ref: '#/components/parameters/PublicReference'
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
  parameters:
    PublicReference:
      name: reference
      in: path
      required: true
      description: شناسه عمومی پلتفرم؛ شناسه داخلی یا Kimia نیست
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  responses:
    GenericSuccess:
      description: پاسخ موفق استاندارد مشتری
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    PaginatedSuccess:
      description: پاسخ موفق صفحه‌بندی‌شده
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaginatedEnvelope' }
    AssetListSuccess:
      description: فهرست مانده‌های مالی مشتری
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AssetListEnvelope' }
    BootstrapSuccess:
      description: قراردادهای Bootstrap
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    Unauthenticated:
      description: کاربر احراز هویت نشده است
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: دسترسی به منبع مجاز نیست
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ResourceNotFound:
      description: منبع متعلق به مشتری پیدا نشد
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationFailed:
      description: داده ورودی معتبر نیست
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: تعداد درخواست بیش از حد مجاز است
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: درخواست با وضعیت فعلی منبع قابل انجام نیست
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    SuccessEnvelope:
      type: object
      required: [data, meta, message]
      properties:
        data:
          type: object
          additionalProperties: true
        meta: { $ref: '#/components/schemas/ResponseMeta' }
        message:
          type: [string, 'null']
    PaginatedEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
            meta:
              allOf:
                - $ref: '#/components/schemas/ResponseMeta'
                - $ref: '#/components/schemas/PaginationMeta'
    AssetListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/AssetBalance' }
    ErrorEnvelope:
      type: object
      required: [message, code, errors, request_id]
      additionalProperties: false
      properties:
        message:
          type: string
        code:
          type: string
          enum: [UNAUTHENTICATED, FORBIDDEN, RESOURCE_NOT_FOUND, VALIDATION_FAILED, RATE_LIMITED, METHOD_NOT_ALLOWED, INTERNAL_ERROR, CONFLICT]
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        request_id:
          type: [string, 'null']
          format: uuid
    ResponseMeta:
      type: object
      required: [request_id, generated_at, api_version]
      properties:
        request_id:
          type: [string, 'null']
          format: uuid
        generated_at:
          type: string
          format: date-time
        api_version:
          type: string
          const: v1
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1, maximum: 50 }
        total: { type: integer, minimum: 0 }
        last_page: { type: integer, minimum: 1 }
    AssetBalance:
      type: object
      required: [reference, type, title, unit, balance]
      properties:
        reference:
          type: string
          description: شناسه پلتفرمی؛ شناسه Kimia نیست
        type:
          type: string
          enum: [money, gold, coin, currency]
        title: { type: string }
        unit: { type: string }
        balance:
          type: object
          required: [total, blocked, available]
          properties:
            total: { type: string, pattern: '^-?[0-9]+(?:\.[0-9]+)?$' }
            blocked: { type: string, pattern: '^-?[0-9]+(?:\.[0-9]+)?$' }
            available: { type: string, pattern: '^-?[0-9]+(?:\.[0-9]+)?$' }
