name: Backend Validation

on:
  pull_request:
    branches:
      - feature/goldplatform-developer-mcp
  push:
    branches:
      - feature/goldplatform-developer-mcp

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: goldplatform_test
          MYSQL_USER: goldplatform
          MYSQL_PASSWORD: goldplatform
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_KEY: base64:QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: goldplatform_test
      DB_USERNAME: goldplatform
      DB_PASSWORD: goldplatform
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      REDIS_HOST: 127.0.0.1
      KIMIA_BASE_URL: https://kimia.invalid
      KIMIA_USERNAME: test
      KIMIA_PASSWORD: test

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, zip
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan config:clear

      - name: Migration fresh
        run: php artisan migrate:fresh --force --no-interaction

      - name: PHPUnit
        run: php artisan test --no-ansi

      - name: Laravel health
        run: |
          php artisan about --only=environment,cache,drivers
          php artisan route:list --except-vendor

      - name: Docker compose validation
        working-directory: .
        run: docker compose config --quiet
