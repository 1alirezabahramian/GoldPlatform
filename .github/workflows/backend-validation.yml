name: Backend RC1 Validation

on:
  pull_request:
    branches:
      - feature/goldplatform-developer-mcp
  push:
    branches:
      - feature/goldplatform-developer-mcp

jobs:
  backend-rc1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: goldplatform_test
          MYSQL_USER: goldplatform
          MYSQL_PASSWORD: goldplatform
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_KEY: base64:QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: goldplatform_test
      DB_USERNAME: goldplatform
      DB_PASSWORD: goldplatform
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      REDIS_HOST: 127.0.0.1
      KIMIA_BASE_URL: https://kimia.invalid
      KIMIA_USERNAME: test
      KIMIA_PASSWORD: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, zip
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan config:clear

      - name: Migration fresh
        run: php artisan migrate:fresh --force --no-interaction

      - name: Unit Tests
        run: php artisan test --testsuite=Unit --no-ansi

      - name: Feature Tests
        run: php artisan test --testsuite=Feature --no-ansi

      - name: Financial and Ledger Tests
        run: php artisan test --no-ansi --filter='Financial|Decimal|Ledger|BalanceProjection'

      - name: Order Lifecycle Tests
        run: php artisan test --no-ansi --filter='OrderStateMachine|OrderCreationSecurity'

      - name: Trade Idempotency and Settlement Tests
        run: php artisan test --no-ansi --filter='TradeEngineCompletion|Settlement'

      - name: Custody and Delivery Tests
        run: php artisan test --no-ansi --filter='Stages789Completion'

      - name: Permission Tests
        run: php artisan test --no-ansi --filter='BackendRc1GateTest|Stages1011CompletionTest'

      - name: Kimia Mock Tests
        run: php artisan test tests/Unit/Kimia --no-ansi

      - name: Kimia Read-Only Integration Contract
        run: php artisan test --no-ansi --filter='kimia_read_only_flow_uses_only_get_requests'

      - name: Full Regression Suite
        run: php artisan test --no-ansi

      - name: Laravel Health Check
        run: |
          php artisan about --only=environment,cache,drivers
          php artisan route:list --except-vendor
          php artisan migrate:status

      - name: Docker Compose Validation
        working-directory: .
        run: docker compose config --quiet

      - name: Secret Scan
        working-directory: .
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 \
            detect --source=/repo --no-git --redact --exit-code=1
