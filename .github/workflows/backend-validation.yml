name: Backend RC1 Validation

on:
  pull_request:
    branches:
      - feature/goldplatform-developer-mcp
      - recovery/rc2-snapshot-2026-08-04
      - recovery/rc2-product-rebuild
      - v2/v2-01-canonical-runtime-integration
  push:
    branches:
      - feature/goldplatform-developer-mcp
      - recovery/rc2-product-rebuild

jobs:
  backend-rc1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: goldplatform_test
          MYSQL_USER: goldplatform
          MYSQL_PASSWORD: goldplatform
          MYSQL_ROOT_PASSWORD: root
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_KEY: base64:QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
