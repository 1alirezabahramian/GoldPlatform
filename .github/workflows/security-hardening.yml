name: Security Hardening

on:
  pull_request:
    branches:
      - feature/goldplatform-developer-mcp
      - recovery/rc2-product-rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: goldplatform_test
          MYSQL_USER: goldplatform
          MYSQL_PASSWORD: goldplatform
          MYSQL_ROOT_PASSWORD: root
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_KEY: base64:REREREREREREREREREREREREREREREREREREREREREQ=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: goldplatform_test
      DB_USERNAME: goldplatform
      DB_PASSWORD: goldplatform
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      KIMIA_BASE_URL: https://kimia.invalid
      KIMIA_USERNAME: test
      KIMIA_PASSWORD: test
      KIMIA_READ_ONLY: 'true'
      KIMIA_WRITE_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, zip
          coverage: none

      - name: Validate Composer metadata
        working-directory: backend
        run: composer validate --strict

      - name: Install locked dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit PHP dependencies
        working-directory: backend
        run: composer audit --locked --no-interaction

      - name: Prepare database
        working-directory: backend
        run: php artisan migrate:fresh --force --no-interaction

      - name: Run security-focused tests
        working-directory: backend
        run: php artisan test --no-ansi --filter='SecurityHeadersTest|Permission|OrderCreationSecurity|KimiaClientTest|ProductionConfigurationGuardTest'
