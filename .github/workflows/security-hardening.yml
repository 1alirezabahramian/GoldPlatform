name: Security Hardening

on:
  pull_request:
    branches:
      - feature/goldplatform-developer-mcp
  workflow_dispatch:

permissions:
  contents: write

jobs:
  security-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_KEY: base64:REREREREREREREREREREREREREREREREREREREREREQ=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      KIMIA_BASE_URL: https://kimia.invalid
      KIMIA_USERNAME: test
      KIMIA_PASSWORD: test
      KIMIA_READ_ONLY: 'true'
      KIMIA_WRITE_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Validate Composer metadata
        working-directory: backend
        run: composer validate --strict

      - name: Update vulnerable Guzzle release
        working-directory: backend
        run: composer update guzzlehttp/guzzle --with-all-dependencies --no-interaction --no-progress

      - name: Audit PHP dependencies
        working-directory: backend
        run: composer audit --locked --no-interaction

      - name: Run full test suite
        working-directory: backend
        run: php artisan test --no-ansi

      - name: Commit patched lockfile when changed
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- backend/composer.lock; then
            echo "composer.lock already secure"
            exit 0
          fi
          git config user.name "goldplatform-ci"
          git config user.email "actions@users.noreply.github.com"
          git add backend/composer.lock
          git commit -m "fix(security): update Guzzle to patched release"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
