name: Admin Operator Frontend

on:
  pull_request:
    paths:
      - 'frontend-admin/**'
      - '.github/workflows/admin-operator-frontend.yml'
      - 'docs/frontend/ADMIN-OPERATOR-FRONTEND-FOUNDATION.md'

permissions:
  contents: read

jobs:
  admin-operator-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Contract tests
        run: npm run test:contract
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Secret scan
        run: |
          ! grep -RInE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|sk-[A-Za-z0-9_-]{20,}|KIMIA_(USERNAME|PASSWORD)=)' . --exclude-dir=node_modules --exclude=package-lock.json
