name: Demo Visual Preview

on:
  push:
    branches: ['recovery/rc2-product-rebuild']
    paths:
      - 'demo-preview/**'
      - '.github/workflows/demo-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-visual-preview
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate safe premium customer demo
        run: |
          test -f demo-preview/index.html
          grep -q 'نسخه نمایشی حرفه‌ای' demo-preview/index.html
          grep -q 'واریز و شارژ حساب' demo-preview/index.html
          grep -q 'درخواست برداشت' demo-preview/index.html
          grep -q 'انتقال داخلی' demo-preview/index.html
          grep -q 'ارتباط با ادمین' demo-preview/index.html
          grep -q 'تحویل و امانات' demo-preview/index.html
          grep -q 'تاریخچه درخواست‌ها' demo-preview/index.html
          grep -q 'مانده‌های پول، طلا، سکه و ارز در نسخه واقعی فقط از Kimia خوانده می‌شوند' demo-preview/index.html
          if grep -RInE '94\.101\.184\.26|/api/voucher/|KIMIA_(USERNAME|PASSWORD|TOKEN)|fetch\(|XMLHttpRequest|\$fetch' demo-preview; then
            echo 'Unsafe external, API or Kimia reference found in demo preview'
            exit 1
          fi

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-preview
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
