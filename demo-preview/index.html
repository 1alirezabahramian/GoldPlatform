<style>
:root{--bg:#f3f5f2;--surface:#fff;--surface2:#f8faf8;--ink:#16201b;--muted:#6b746f;--brand:#173d2e;--brand2:#245541;--gold:#b68a34;--line:#dfe4e0;--ok:#257552;--warn:#9a6a13;--danger:#a8473d;--info:#2f668d;--r:18px;--shadow:0 12px 34px rgba(24,43,34,.08)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef2ed,var(--bg));color:var(--ink);font-family:Tahoma,"Segoe UI",sans-serif}.demo-bar{position:sticky;top:0;z-index:50;padding:10px 16px;text-align:center;background:#70531d;color:#fff;font-size:13px;font-weight:800}.shell{max-width:1400px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:16px;background:linear-gradient(145deg,var(--brand),#2b624b);display:grid;place-items:center;color:#f3d18a;font-size:25px;box-shadow:var(--shadow)}h1{font-size:22px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:5px}.roles{display:flex;gap:8px;flex-wrap:wrap}.role{border:1px solid var(--line);background:#fff;padding:10px 15px;border-radius:12px;cursor:pointer;font-weight:800;color:var(--ink)}.role.active{background:var(--brand);color:#fff;border-color:var(--brand)}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px}.side,.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.side{padding:14px;height:max-content;position:sticky;top:62px}.side-title{font-size:12px;color:var(--muted);padding:8px 10px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:right;padding:12px;border-radius:12px;color:var(--muted);font-weight:800;cursor:pointer}.nav button.active,.nav button:hover{background:#eaf1ed;color:var(--brand)}.content{display:grid;gap:16px}.hero{padding:22px;background:linear-gradient(135deg,#143b2b,#255a44);color:#fff;border-radius:24px;box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h2{margin:0 0 8px;font-size:24px}.hero p{margin:0;color:#dbe9e1;line-height:1.9}.badge{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.12);white-space:nowrap;font-size:12px}.notice{padding:13px 16px;border:1px dashed #d0b36f;background:#fffaec;border-radius:14px;color:#725113;font-size:13px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:18px}.metric .value{font-size:24px;font-weight:900;margin:10px 0 6px}.label,.hint{color:var(--muted);font-size:12px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.section-title h3{margin:0;font-size:17px}.fake{font-size:11px;color:var(--warn);background:#fff4d9;padding:5px 8px;border-radius:999px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}.table th{color:var(--muted)}.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.ok{background:#e4f4ec;color:var(--ok)}.pending{background:#fff3d8;color:var(--warn)}.danger{background:#fde9e6;color:var(--danger)}.info{background:#e6f0f7;color:var(--info)}.two{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.list{display:grid;gap:10px}.list-item{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);background:var(--surface2);border-radius:13px}.list-item strong{font-size:13px}.list-item small{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.btn.primary{background:var(--brand);color:#fff}.btn.secondary{background:#eaf1ed;color:var(--brand)}.btn.disabled{background:#edf0ed;color:#9aa19d}.search{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}.empty{text-align:center;padding:34px 16px;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:8px}.mobile-nav{display:none}.mobile-more{display:none}.hidden{display:none!important}@media(max-width:950px){.two{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:820px){.shell{padding:14px 12px 92px}.top{align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}.side{display:none}.hero{align-items:flex-start;flex-direction:column}.mobile-nav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding:8px 8px max(8px,env(safe-area-inset-bottom))}.mobile-nav button{border:0;background:transparent;padding:8px 4px;font-size:11px;color:var(--muted)}.mobile-nav button.active{color:var(--brand);font-weight:900}}@media(max-width:540px){.grid{grid-template-columns:1fr}.roles{width:100%}.role{flex:1;padding:9px}.hero h2{font-size:20px}}
</style></head>
<body>
<div class="demo-bar">نسخه نمایشی — تمام اطلاعات ساختگی است — هیچ عملیات مالی یا اتصال به Kimia انجام نمی‌شود</div>
<main class="shell"><header class="top"><div class="brand"><div class="logo">ط</div><div><h1>GoldPlatform</h1><div class="sub">پیش‌نمایش کامل ظاهری، امن و غیرعملیاتی</div></div></div><div class="roles"><button class="role active" data-role="customer">کاربر</button><button class="role" data-role="operator">اپراتور</button><button class="role" data-role="admin">ادمین</button></div></header>
<div class="layout"><aside class="side"><div class="side-title" id="sideTitle"></div><nav class="nav" id="desktopNav"></nav></aside><section class="content"><div class="hero"><div><h2 id="heroTitle"></h2><p id="heroText"></p></div><span class="badge" id="roleBadge"></span></div><div class="notice">برای ارزیابی طراحی، خوانایی فارسی، واکنش‌گرایی، منوها، جدول‌ها و وضعیت‌هاست. همه دکمه‌های ثبت، تأیید، تسویه و تغییر داده غیرفعال‌اند.</div><div id="page"></div></section></div></main><nav class="mobile-nav" id="mobileNav"></nav>
<script>
const D={
customer:{title:'پنل مشتری',hero:'سلام، علیرضا 👋',text:'دارایی‌ها، سفارش‌ها، امانات و درخواست‌های تحویل در یک تجربه ساده و موبایل‌محور.',nav:[['dashboard','داشبورد'],['assets','دارایی‌ها'],['orders','سفارش‌ها'],['custody','امانات'],['delivery','تحویل'],['profile','پروفایل']]},
operator:{title:'پنل اپراتور',hero:'مرکز عملیات روزانه',text:'صف‌های کاری شفاف برای بررسی سفارش، امانت، تحویل و پیگیری‌های روزانه.',nav:[['overview','نمای کلی'],['orderQueue','صف سفارش‌ها'],['deliveryQueue','صف تحویل'],['followups','پیگیری‌ها'],['alerts','اعلان‌ها']]},
admin:{title:'پنل مدیریت',hero:'پایش و مدیریت سامانه',text:'نمای مدیریتی فقط‌خواندنی برای سلامت سرویس‌ها، Audit، Outbox، کاربران و برند.',nav:[['monitor','مانیتورینگ'],['audit','Audit Logs'],['outbox','Outbox'],['users','کاربران'],['brand','تنظیمات برند'],['access','دسترسی‌ها']]}}
let role='customer',route='dashboard';
const s=v=>v.includes('تکمیل')||v.includes('آماده')||v.includes('ثبت')||v.includes('پایدار')?'ok':v.includes('خطا')||v.includes('توجه')||v.includes('رد')?'danger':v.includes('در صف')||v.includes('بررسی')||v.includes('انتظار')?'pending':'info';
const metrics=a=>`<div class="grid">${a.map(x=>`<article class="card metric"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="hint">${x[2]}</div></article>`).join('')}</div>`;
const table=(title,head,rows)=>`<article class="card"><div class="section-title"><h3>${title}</h3><span class="fake">داده ساختگی</span></div><div class="table-wrap"><table class="table"><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((x,i)=>i===r.length-1?`<td><span class="status ${s(x)}">${x}</span></td>`:`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div></article>`;
const list=(title,items)=>`<article class="card"><div class="section-title"><h3>${title}</h3><span class="fake">نمایشی</span></div><div class="list">${items.map(x=>`<div class="list-item"><div><strong>${x[0]}</strong><br><small>${x[1]}</small></div><span class="status ${s(x[2])}">${x[2]}</span></div>`).join('')}</div></article>`;
const actions=()=>`<article class="card"><div class="section-title"><h3>عملیات نمایشی</h3><span class="fake">غیرفعال</span></div><div class="actions"><button class="btn primary" onclick="demo()">مشاهده جزئیات</button><button class="btn secondary" onclick="demo()">دانلود رسید نمایشی</button><button class="btn disabled" onclick="demo()">ثبت عملیات</button><button class="btn disabled" onclick="demo()">تأیید نهایی</button></div></article>`;
const pages={
customer:{dashboard:()=>metrics([['وضعیت دارایی','در انتظار اتصال معتبر','مانده واقعی فقط از Kimia'],['سفارش فعال','۲ مورد','بدون عملیات واقعی'],['امانت فیزیکی','۳ قلم','مستقل از مانده مالی']])+`<div class="two">${list('دسترسی سریع',[['خرید و فروش','ورود به جریان سفارش نمایشی','نمایشی'],['درخواست تحویل','انتخاب امانت و زمان دریافت','نمایشی'],['گزارش فعالیت','مرور اتفاق‌های اخیر','نمایشی']])}${list('آخرین فعالیت‌ها',[['سفارش خرید طلا','۱۲٫۵ گرم','در انتظار'],['ثبت امانت شمش','۱ قطعه','ثبت‌شده'],['درخواست تحویل','کد DL-204','در بررسی']])}</div>`+actions(),assets:()=>metrics([['پول من','نمایش‌داده نمی‌شود','Demo به Kimia متصل نیست'],['طلای من','نمایش‌داده نمی‌شود','مانده ساختگی نمایش داده نمی‌شود'],['سکه و ارز','لیست نمایشی','محصولات در نسخه واقعی Dynamic هستند']])+table('دارایی‌های نمایشی',['نوع','عنوان','نمایش','وضعیت'],[['پول','موجودی ریالی','—','عدم اتصال'],['طلا','طلای ۱۸ عیار','—','عدم اتصال'],['سکه','امامی، نیم، ربع','فهرست نمونه','نمایشی'],['ارز','دلار و یورو','فهرست نمونه','نمایشی']]),orders:()=>metrics([['همه سفارش‌ها','۱۲','نمونه'],['فعال','۲','نیازمند پیگیری'],['تکمیل‌شده','۹','سوابق نمایشی']])+table('سفارش‌ها',['کد','نوع','مقدار','زمان','وضعیت'],[['DM-1024','خرید طلا','۱۲٫۵ گرم','امروز ۱۰:۰۵','در انتظار'],['DM-1023','فروش سکه','۱ عدد','دیروز ۱۷:۴۰','تکمیل‌شده'],['DM-1022','خرید طلا','۵ گرم','دیروز ۱۲:۲۰','ردشده'],['DM-1019','فروش طلا','۲٫۲ گرم','شنبه ۰۹:۱۵','تکمیل‌شده']])+actions(),custody:()=>metrics([['کل امانات','۳ قلم','داده ساختگی'],['آماده تحویل','۱ قلم','بدون اثر مالی'],['در نگهداری','۲ قلم','مستقل از Wallet']])+table('امانات فیزیکی',['شناسه','نوع','مشخصات','محل','وضعیت'],[['CU-310','شمش','۵۰ گرم','خزانه مرکزی','در نگهداری'],['CU-309','پارسیان','۱٫۵ گرم','خزانه مرکزی','آماده تحویل'],['CU-301','آبشده','۸۷ گرم','خزانه شماره ۲','در نگهداری']]),delivery:()=>metrics([['درخواست فعال','۱','نمونه'],['آماده دریافت','۱','نیازمند مراجعه'],['تحویل‌شده','۴','سابقه نمایشی']])+table('درخواست‌های تحویل',['کد','امانت','زمان انتخابی','محل','وضعیت'],[['DL-204','پارسیان ۱٫۵ گرم','امروز ۱۶:۰۰','شعبه مرکزی','آماده'],['DL-198','شمش ۲۰ گرم','دوشنبه ۱۲:۰۰','شعبه مرکزی','تکمیل‌شده']])+actions(),profile:()=>`<div class="two"><article class="card"><div class="section-title"><h3>اطلاعات حساب</h3><span class="fake">ساختگی</span></div><div class="list"><div class="list-item"><span>نام</span><strong>علیرضا بهرامیان</strong></div><div class="list-item"><span>شماره همراه</span><strong>۰۹۱۲••••۱۲۳</strong></div><div class="list-item"><span>وضعیت احراز هویت</span><span class="status ok">تأییدشده نمایشی</span></div></div></article>${list('تنظیمات',[['اعلان‌ها','پیامک و اعلان درون‌برنامه','فعال'],['امنیت','ورود دومرحله‌ای','نمایشی'],['حریم خصوصی','مدیریت نشست‌ها','نمایشی']])}</div>`},
operator:{overview:()=>metrics([['صف سفارش','۸ مورد','اولویت‌بندی نمایشی'],['صف تحویل','۴ مورد','بدون دسترسی مالی'],['نیازمند توجه','۲ مورد','پیگیری اپراتور']])+`<div class="two">${list('کارهای فوری',[['بررسی سفارش OP-481','ثبت‌شده در ۱۰:۰۵','در بررسی'],['آماده‌سازی تحویل OP-480','تحویل حضوری','آماده'],['رفع نقص مدارک OP-479','تماس با مشتری','نیازمند توجه']])}${list('سلامت عملیات',[['زمان پاسخ متوسط','۹ دقیقه','پایدار'],['موارد باز قدیمی','۱ مورد','نیازمند توجه'],['تحویل امروز','۶ مورد','آماده']])}</div>`,orderQueue:()=>metrics([['منتظر بررسی','۵','نمونه'],['منتظر مشتری','۲','نمونه'],['تأییدشده','۱','نمونه']])+table('صف سفارش‌ها',['اولویت','کد','فرآیند','مشتری','وضعیت'],[['بالا','OP-481','خرید طلا','مشتری نمونه ۲۱','در بررسی'],['عادی','OP-476','فروش سکه','مشتری نمونه ۰۸','در انتظار'],['عادی','OP-474','خرید طلا','مشتری نمونه ۱۳','تأییدشده']])+actions(),deliveryQueue:()=>metrics([['امروز','۴','در صف'],['آماده','۲','قابل تحویل'],['مدرک ناقص','۱','نیازمند توجه']])+table('صف تحویل',['کد','نوع','زمان','شعبه','وضعیت'],[['OP-D91','پارسیان','۱۶:۰۰','مرکزی','آماده'],['OP-D90','شمش','۱۵:۳۰','مرکزی','در بررسی'],['OP-D88','آبشده','۱۴:۰۰','شعبه ۲','نیازمند توجه']]),followups:()=>list('پیگیری‌های امروز',[['تماس با مشتری نمونه ۱۲','نقص مدرک شناسایی','نیازمند توجه'],['تأیید زمان تحویل OP-D91','پیامک ارسال شده','در انتظار'],['بستن مورد OP-460','مدارک کامل شد','تکمیل‌شده']])+actions(),alerts:()=>list('اعلان‌های اپراتوری',[['افزایش صف سفارش','بیش از ۵ مورد منتظر بررسی','نیازمند توجه'],['تحویل نزدیک','OP-D91 کمتر از ۲ ساعت','در انتظار'],['اختلالی ثبت نشده','سرویس‌های نمایشی پایدارند','پایدار']])},
admin:{monitor:()=>metrics([['سلامت سرویس‌ها','پایدار نمایشی','بدون اتصال واقعی'],['Audit امروز','۱۲۸ رخداد','Payload حساس مخفی'],['Outbox معوق','۳ پیام','Retry غیرفعال']])+`<div class="two">${list('سرویس‌ها',[['Customer Frontend','آخرین بررسی ۲ دقیقه پیش','پایدار'],['Admin Operator Frontend','آخرین بررسی ۳ دقیقه پیش','پایدار'],['Backend API','محیط Demo متصل نیست','عدم اتصال']])}${list('هشدارهای مدیریتی',[['Outbox backlog','۳ پیام نمایشی','در صف'],['Backup verification','محیط واقعی اجرا نشده','نیازمند توجه'],['Kimia Write','عمداً غیرفعال','پایدار']])}</div>`,audit:()=>metrics([['رویدادها','۱۲۸','نمونه'],['ورودها','۲۴','نمونه'],['رد دسترسی','۳','نمونه']])+table('Audit Logs',['زمان','Actor','عملیات','بخش','وضعیت'],[['۱۰:۰۲','operator.demo','مشاهده سفارش','Orders','ثبت‌شده'],['۰۹:۵۸','admin.demo','مشاهده گزارش','Reports','ثبت‌شده'],['۰۹:۴۱','operator.demo','تلاش دسترسی','Admin','ردشده']]),outbox:()=>metrics([['در صف','۳','نمونه'],['ارسال‌شده','۴۶','نمونه'],['ناموفق','۱','نمونه']])+table('Outbox',['شناسه','نوع پیام','تلاش','آخرین بروزرسانی','وضعیت'],[['OB-447','اعلان تحویل','۰','۱۰:۰۱','در صف'],['OB-445','رسید سفارش','۱','۰۹:۵۵','ارسال‌شده'],['OB-440','پیامک وضعیت','۳','۰۹:۱۰','خطا']])+actions(),users:()=>metrics([['مشتری','۱٬۲۴۰','ساختگی'],['اپراتور','۱۲','ساختگی'],['ادمین','۳','ساختگی']])+table('کاربران نمایشی',['نام','نقش','آخرین ورود','محدوده','وضعیت'],[['کاربر نمونه ۲۱','مشتری','امروز ۱۰:۰۵','Customer','فعال'],['اپراتور نمونه ۰۳','اپراتور','امروز ۰۹:۴۸','Branch 1','فعال'],['مدیر نمونه ۰۱','ادمین','دیروز ۱۸:۲۰','Company','فعال']]),brand:()=>`<div class="two"><article class="card"><div class="section-title"><h3>هویت برند</h3><span class="fake">نمایشی</span></div><div class="list"><div class="list-item"><span>نام برند</span><strong>GoldPlatform Demo</strong></div><div class="list-item"><span>رنگ اصلی</span><strong>#173d2e</strong></div><div class="list-item"><span>دامنه</span><strong>demo.example.com</strong></div></div></article>${list('قابلیت‌های White-label',[['لوگ function render(){const m=D[role];if(!m.nav.some(x=>x[0]===route))route=m.nav[0][0];sideTitle.textContent=m.title;heroTitle.textContent=m.hero;heroText.textContent=m.text;roleBadge.textContent=m.title;desktopNav.innerHTML=m.nav.map(x=>`<button class="${x[0]===route?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');mobileNav.innerHTML=m.nav.slice(0,4).map(x=>`<button class="${x[0]===route?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');page.innerHTML=(pages[role][route]||(()=>'<div class="card empty"><b>صفحه در حال آماده‌سازی</b>این بخش در دموی فعلی موجود نیست.</div>'))()}
