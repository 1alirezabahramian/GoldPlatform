services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.production
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      php:
        condition: service_healthy
    networks: [gold]

  storage-init:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.production
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        mkdir -p
        /var/www/html/storage/app/public
        /var/www/html/storage/framework/cache/data
        /var/www/html/storage/framework/sessions
        /var/www/html/storage/framework/views
        /var/www/html/storage/logs
        && chown -R www-data:www-data /var/www/html/storage
    volumes:
      - type: volume
        source: app-storage
        target: /var/www/html/storage
        volume:
          nocopy: true
    networks: [gold]
    restart: "no"

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.production
    restart: unless-stopped
    env_file:
      - backend/.env.production
    volumes:
      - type: volume
        source: app-storage
        target: /var/www/html/storage
        volume:
          nocopy: true
    depends_on:
      storage-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [gold]

  queue-worker:
    profiles: [workers]
    build:
      context: .
      dockerfile: docker/php/Dockerfile.production
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90", "--max-time=3600"]
    env_file:
      - backend/.env.production
    volumes:
      - type: volume
        source: app-storage
        target: /var/www/html/storage
        volume:
          nocopy: true
    depends_on:
      storage-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [gold]

  scheduler:
    profiles: [workers]
    build:
      context: .
      dockerfile: docker/php/Dockerfile.production
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - backend/.env.production
    volumes:
      - type: volume
        source: app-storage
        target: /var/www/html/storage
        volume:
          nocopy: true
    depends_on:
      storage-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [gold]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [gold]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [gold]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  gold:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  app-storage:
